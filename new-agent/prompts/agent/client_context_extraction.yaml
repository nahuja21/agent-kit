# Client Context Extraction Prompt
# Step 4: Extract client background and company information
# Sources: Assessment, Case Study, Agreement, Kick-off, and Web Search

step: client_context_extraction

prompt:
  instructions: |
    You are extracting client background and company information for a case study.
    Analyze the provided document content and web search results to build a complete client profile.
    Return only valid JSON matching the specified format.
    
    ACCURACY IS CRITICAL - CROSS-VALIDATE INFORMATION:
    1. Check multiple web sources against each other
    2. If sources disagree, note the discrepancy and report a range or the most credible source
    3. Prioritize: Documents > Official company sources > LinkedIn/Crunchbase > News articles
    4. When uncertain, set confidence to "low" and explain in notes
    5. Never hallucinate - if data isn't available, set to null
    
    Be thorough but accurate - only include information you can verify from the sources.

  user_template: |
    # Client Context Extraction
    
    ## Client Name Hint
    The project folder is named: **{{client_name_hint}}**
    Use this as a hint, but verify/refine the client name from document content.
    
    ## Web Search Results
    (Use for revenue, employees, and to supplement document information)
    
    {{web_search_results}}
    
    ---
    
    ## Document Contents
    (Primary source - prioritize information from these documents)
    
    {{document_contents}}
    
    ---
    
    # YOUR TASK
    
    Extract client context information from the documents and web search above.
    
    ## FIELDS TO EXTRACT
    
    ### 1. CLIENT IDENTIFICATION
    
    - `client_name`: Official company name (verify from documents, not just folder name)
    - `industry_primary`: Primary industry (e.g., "Healthcare", "Manufacturing", "Retail")
    - `industry_secondary`: Secondary industry if applicable (optional)
    - `business_model`: Business model description (e.g., "multi-site healthcare provider", "specialty manufacturer", "regional distributor")
    
    ### 2. OWNERSHIP & BACKGROUND
    
    - `sponsor_pe_firm`: Private equity sponsor if PE-backed (look for "backed by", "portfolio company of", "owned by")
      - If not PE-backed, set to null
    - `client_history`: Brief background on the company (1-3 sentences about founding, growth, market position)
    
    ### 3. SIZE METRICS (CROSS-VALIDATE ACROSS SOURCES)
    
    For each metric, provide:
    - The value
    - Confidence level: "high" (multiple sources agree), "medium" (single source or minor discrepancy), "low" (uncertain or major discrepancy)
    - Source: Be specific - which website, database, or document
    - Notes: Explain your reasoning, cite multiple sources if available
    
    **Revenue:**
    - CROSS-VALIDATE: Check multiple sources (LinkedIn, Crunchbase, news articles, company website)
    - If sources disagree, note the range (e.g., "$50M-$100M based on conflicting sources")
    - Prefer: SEC filings > press releases > LinkedIn > estimation sites
    - Format as full number (e.g., 150000000 for $150M)
    - If using an estimate, set confidence to "low" and explain methodology
    
    **EBITDA:**
    - Only include if explicitly stated in documents or credible financial source
    - Do NOT estimate or calculate - if not found, set to null
    - Format as full number
    
    **Locations Count:**
    - Look for: "X locations", "X sites", "X clinics", "X facilities", "X stores"
    - Cross-check: company website "locations" page vs news vs documents
    - Count from documents if listed individually
    - If sources disagree, prefer official company sources
    
    **Employees Count:**
    - Cross-check: LinkedIn company page vs Crunchbase vs news articles
    - LinkedIn is usually reliable for this
    - Note the date of the data if available (companies grow/shrink)
    
    ## OUTPUT FORMAT
    
    Return valid JSON only:
    
    ```json
    {
      "client": {
        "client_name": "Acme Healthcare",
        "industry_primary": "Healthcare",
        "industry_secondary": "Dermatology",
        "business_model": "Multi-site specialty dermatology practice",
        "sponsor_pe_firm": "Summit Partners",
        "client_history": "Founded in 2010, Acme Healthcare has grown to become one of the largest dermatology platforms in the Northeast."
      },
      "size_metrics": {
        "revenue": {
          "amount": 150000000,
          "currency": "USD",
          "confidence": "medium",
          "source": "Crunchbase profile and LinkedIn",
          "notes": "Crunchbase shows $150M (2023). LinkedIn estimates $100-200M range. Using Crunchbase figure as more specific."
        },
        "ebitda": null,
        "locations": {
          "count": 45,
          "confidence": "high",
          "source": "Assessment/Client Overview.pptx (slide 3)",
          "notes": "Listed as 45 clinic locations across 5 states. Confirmed by company website locations page."
        },
        "employees": {
          "count": 850,
          "confidence": "high",
          "source": "LinkedIn company page",
          "notes": "LinkedIn shows 823 employees. Company website 'About' page says 800+. Using LinkedIn figure (more current)."
        }
      },
      "extraction_sources": [
        "Assessment/Client Overview.pptx",
        "Case Study/Acme Case Study.pdf",
        "LinkedIn company page",
        "Crunchbase profile",
        "Company website"
      ],
      "extraction_notes": [
        "Revenue cross-validated: Crunchbase ($150M) vs LinkedIn ($100-200M range) - minor discrepancy, using Crunchbase",
        "EBITDA not found in any documents or web sources",
        "PE ownership (Summit Partners) confirmed in both Crunchbase and company press release"
      ]
    }
    ```
    
    ## IMPORTANT RULES
    
    1. **Verify client_name** from documents - don't just use the folder name hint
    2. **Revenue/EBITDA** should be full dollar amounts (150000000 not "150M")
    3. **Locations/Employees** should be integer counts
    4. **CROSS-VALIDATE**: Check multiple sources before reporting a value
       - If sources agree: confidence = "high", note "Confirmed by X and Y"
       - If minor discrepancy: confidence = "medium", note the range
       - If major discrepancy or single source: confidence = "low", explain
    5. **Confidence levels:**
       - "high": Multiple sources agree, or explicitly stated in documents
       - "medium": Single credible source, or minor discrepancies
       - "low": Uncertain, conflicting sources, or rough estimate
    6. **Source tracking:** Be specific - which website, which document, which page
       - Good: "LinkedIn company page (as of 2024)", "Crunchbase profile"
       - Bad: "web_search" (too vague)
    7. **PE Sponsor:** Only include if company is PE-backed (common in Treya projects)
    8. **extraction_sources:** List all documents and websites that contributed information
    9. **extraction_notes:** Note any gaps, discrepancies, or data quality issues
    10. **Never hallucinate:** If a field is not found, set it to null

parameters:
  - name: client_name_hint
    type: string
    required: true
    description: "The project folder name to use as a hint for client name"
  
  - name: web_search_results
    type: string
    required: true
    description: "Web search results for company information"
  
  - name: document_contents
    type: string
    required: true
    description: "Extracted content from Assessment, Case Study, Agreement, and Kick-off files"

