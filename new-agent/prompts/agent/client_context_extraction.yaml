          "sponsor_pe_firm": "Shore Capital Partners",
          "client_history": "AP Derm is a leading dermatology practice management company serving the Northeast and Mid-Atlantic regions."
        },
        "size_metrics": {
          "revenue": {
            "amount": 175000000,
            "currency": "USD",
            "confidence": "medium",
            "source": "web_search",
            "notes": "Estimated based on industry multiples"
          },
          "ebitda": null,
          "locations": {
            "count": 52,
