      | Office Supplies | $175,000 | 80% | $14,000 | $21,000 |
      | Total | $6,300,000 | - | $540,000 | $928,000 |
      
      EXHIBIT B - PROJECT FEES
      Project Fee: $190,000 (fixed fee)
      Minimum Savings Guarantee: 2X Project Fee ($380,000)
    output: |
      {
        "exhibit_a": {
          "initial_categories": ["Medical Supplies", "Office Supplies"],
          "initial_categories_count": 2,
          "category_details": [
            {"category_name": "Medical Supplies", "spend": 1800000, "addressable_pct": 100, "addressable_spend": 1800000, "savings_low": 180000, "savings_high": 270000},
            {"category_name": "Office Supplies", "spend": 175000, "addressable_pct": 80, "addressable_spend": 140000, "savings_low": 14000, "savings_high": 21000}
          ],
          "total_spend": 6300000,
          "total_addressable_spend": 1940000,
          "savings_estimate_low": 540000,
          "savings_estimate_high": 928000
        },
        "exhibit_b": {
          "fee_type": "fixed",
          "fee_amount": 190000,
          "minimum_savings_guarantee": 380000,
          "minimum_return_on_fees_ratio": 2.0,
          "fee_hybrid_threshold": null,
          "fee_contingent_percentage": null,
          "fee_notes": null
        },
        "timing": {
          "start_date": null,
          "end_date": null,
          "engagement_type": null
        },
        "extraction_notes": []
      }

  - note: "Hybrid fee example with minimum return on fees ratio"
    input: |
      EXHIBIT B - PROJECT FEES
      Fixed Fee: $175,000
      Variable Fee: 45% of Annual Savings above $210,000 threshold
      Minimum Return on Fees Ratio: 1.2× fixed fees within 15 months
    output: |
      {
        "exhibit_b": {
          "fee_type": "hybrid",
          "fee_amount": 175000,
          "minimum_savings_guarantee": 210000,
          "minimum_return_on_fees_ratio": 1.2,
          "fee_hybrid_threshold": 210000,
          "fee_contingent_percentage": 45,
          "fee_notes": "1.2× fixed fees within 15 months or Treya adjusts its fee"
        }
      }

  - note: "Contingent fee example"
    input: |
      EXHIBIT B - PROJECT FEES
      Fee: 25% of implemented annual savings
    output: |
      {
        "exhibit_b": {
          "fee_type": "contingent",
          "fee_amount": null,
          "minimum_savings_guarantee": null,
          "minimum_savings_guarantee_ratio": null,
          "fee_hybrid_threshold": null,
          "fee_contingent_percentage": 25,
          "fee_notes": null
        }
      }
