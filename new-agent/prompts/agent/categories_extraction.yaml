# Categories Extraction Prompt
# Step 7: Extract detailed category information
# Sources: Impact results (category list), Exhibit A (baseline), Category folders (details)

step: categories_extraction

prompt:
  instructions: |
    You are extracting DETAILED CATEGORY INFORMATION for a Treya Partners case study.
    
    You have been provided:
    1. The confirmed category list from Impact results (source of truth for what was worked)
    2. Exhibit A data with initial baseline spend
    3. Category-specific file contents with vendor, lever, and constraint details
    
    Your job is to enrich each category with as much detail as possible.
    
    Return only valid JSON matching the specified format.

  user_template: |
    # Categories Extraction
    
    ## Client: {{client_name}}
    
    ---
    
    ## CONFIRMED CATEGORY LIST (from Impact/Close-out)
    These are the categories that were actually worked on. Use this as your source of truth.
    
    {{category_list}}
    
    ---
    
    ## EXHIBIT A DATA (Initial Scope - for baseline spend)
    Note: Some categories may have been added/removed during the project.
    Use this for baseline_spend values.
    
    {{exhibit_a_data}}
    
    ---
    
    ## CATEGORY FOLDER CONTENTS
    Detailed files from each category folder (RFPs, analysis, recommendations).
    Use these for vendors, levers, constraints, and evidence.
    
    {{category_folder_contents}}
    
    ---
    
    # YOUR TASK
    
    For EACH category from the confirmed list, extract detailed information.
    
    ## FIELDS TO EXTRACT PER CATEGORY
    
    ### 1. IDENTIFICATION
    
    - `category_label`: Exact category name (Required)
    - `category_l1`, `category_l2`, `category_l3`: Taxonomy levels (Optional - use if mentioned)
    
    ### 2. TIMING
    
    - `start_date`: When work started on this category (YYYY-MM-DD or null)
    - `end_date`: When work completed (YYYY-MM-DD or null)
    - `status`: Current status - must be one of:
      - "implemented" - Contract signed, savings realized
      - "negotiated" - Terms agreed, pending signature
      - "in_progress" - Actively being worked
      - "identified" - Opportunity found, not yet started
      - "not_pursued" - Decided not to proceed
    
    ### 3. VENDORS
    
    - `vendors_before`: Array of incumbent/previous vendors
      - Look for: "current vendor", "incumbent", "existing supplier"
      - Example: ["Staples", "Office Depot"]
    
    - `vendors_after`: Array of selected/recommended vendors
      - Look for: "awarded to", "selected vendor", "new supplier", "recommended"
      - Include context if helpful: ["Premier (GPO)", "Verizon (consolidated)"]
    
    ### 4. LEVERS
    
    - `levers`: Array of sourcing strategies/levers used
      - Common levers: "GPO", "RFP", "consolidation", "renegotiation", "rebid", 
        "specification change", "demand reduction", "payment terms", "volume aggregation"
      - Example: ["GPO tier upgrade", "Vendor consolidation"]
    
    ### 5. CONSTRAINTS
    
    - `constraints`: Object with constraint types:
      - `supplier_constraints`: Must-use vendors, diversity requirements, preferred suppliers
      - `operational_constraints`: No downtime, clinical requirements, spec locks
      - `contractual_constraints`: Existing contract terms, renewal windows
      - `implementation_constraints`: Labor availability, seasonality, regulatory
    
    ### 6. FINANCIALS
    
    - `baseline_spend`: Historical/baseline spend (from Exhibit A or category files)
      - Include: amount, currency, confidence, source_file, notes
    
    - `savings_annual_run_rate`: Annual savings achieved/expected
      - Use data from Impact results
      - Include: amount, currency, confidence, source_file, notes
    
    - `savings_one_time`: One-time savings (signing bonuses, rebates)
      - Include: amount, currency, confidence, source_file, notes
    
    - `savings_percentage`: Calculated (savings ÷ baseline × 100)
      - If you have both savings and baseline, calculate this
    
    ### 7. EVIDENCE & NOTES
    
    - `notes`: Additional context, observations, or caveats
    
    - `evidence`: Array of evidence items
      - `source_file`: File path
      - `page_or_slide`: Page/slide number
      - `quote`: Relevant quote from document
      - `date_extracted`: Today's date ({{extraction_date}})
    
    ## OUTPUT FORMAT
    
    Return valid JSON only:
    
    ```json
    {
      "categories": [
        {
          "category_label": "Medical Supplies",
          "category_l1": "Clinical",
          "category_l2": null,
          "category_l3": null,
          "start_date": "2024-01-15",
          "end_date": "2024-06-30",
          "status": "implemented",
          "vendors_before": ["Medline", "McKesson"],
          "vendors_after": ["Premier GPO (Medline preferred)"],
          "levers": ["GPO tier upgrade", "Volume aggregation"],
          "constraints": {
            "supplier_constraints": "Must maintain Medline as primary due to clinical staff preferences",
            "operational_constraints": "No stockouts during transition - clinical critical",
            "contractual_constraints": null,
            "implementation_constraints": "Phased rollout across 45 locations"
          },
          "baseline_spend": {
            "amount": 1800000,
            "currency": "USD",
            "confidence": "high",
            "source_file": "Agreement/Exhibit A",
            "notes": "Historical annual spend from Exhibit A table"
          },
          "savings_annual_run_rate": {
            "amount": 396000,
            "currency": "USD",
            "confidence": "high",
            "source_file": "Project Closeout/Final Update.pptx",
            "notes": "22% savings through GPO tier upgrade"
          },
          "savings_one_time": null,
          "savings_percentage": 22.0,
          "notes": "Achieved Premier Tier 2 status through volume commitment",
          "evidence": [
            {
              "source_file": "Categories/Medical Supplies/Analysis.xlsx",
              "page_or_slide": "Summary",
              "quote": "Current GPO tier: Standard. Recommended: Tier 2 with 22% average discount improvement",
              "date_extracted": "2026-01-26"
            }
          ]
        },
        {
          "category_label": "Telecom",
          "category_l1": "IT",
          "category_l2": null,
          "category_l3": null,
          "start_date": "2024-02-01",
          "end_date": null,
          "status": "in_progress",
          "vendors_before": ["AT&T", "Verizon", "Local ISP", "Comcast", "T-Mobile"],
          "vendors_after": ["Verizon (consolidated voice/data)"],
          "levers": ["Vendor consolidation", "Contract renegotiation", "RFP"],
          "constraints": {
            "supplier_constraints": null,
            "operational_constraints": "99.9% uptime SLA required for clinical systems",
            "contractual_constraints": "AT&T contract expires Q2 2024",
            "implementation_constraints": "Cutover must happen after hours"
          },
          "baseline_spend": {
            "amount": 500000,
            "currency": "USD",
            "confidence": "high",
            "source_file": "Agreement/Exhibit A",
            "notes": null
