          "savings_annual_run_rate": {
            "amount": 175000,
            "currency": "USD",
            "confidence": "medium",
            "source_file": "Project Updates/March Update.pptx",
            "notes": "Proposal received, awaiting signature"
          },
          "savings_one_time": {
            "amount": 25000,
            "currency": "USD",
            "confidence": "medium",
            "source_file": "Categories/Telecom/Verizon Proposal.pdf",
            "notes": "Signing bonus for 3-year commitment"
          },
          "savings_percentage": 35.0,
          "notes": "Consolidating from 5 vendors to 1. Contract in legal review.",
          "evidence": []
        }
      ],
      "categories_summary": {
        "total_count": 8,
        "implemented_count": 5,
        "in_progress_count": 2,
        "not_pursued_count": 1,
        "total_baseline_spend": 6300000,
        "total_savings": 1250000,
        "average_savings_percentage": 19.8
      },
      "extraction_sources": [
        "Project Closeout/Final Update.pptx",
        "Agreement/Exhibit A",
        "Categories/Medical Supplies/Analysis.xlsx",
        "Categories/Telecom/Verizon Proposal.pdf"
      ],
      "extraction_notes": [
        "Janitorial category excluded by client - not included in list",
        "IT Hardware baseline not in Exhibit A - used category file estimate"
      ]
    }
    ```
    
    ## IMPORTANT RULES
    
    1. **Use Impact category list as source of truth** - only include categories that were actually worked
    2. **Match baseline from Exhibit A** - link by category name (may need fuzzy matching)
    3. **Extract vendors carefully** - before = incumbent, after = selected/recommended
    4. **Levers should be specific** - not just "negotiation" but "GPO tier upgrade" or "vendor consolidation"
    5. **Calculate savings_percentage** if you have both baseline and savings
    6. **Constraints are optional** - only include if mentioned in category files
    7. **Status must match Impact** - use the status from Impact results
    8. **Evidence should be specific** - include file, page/slide, and quote when possible
    9. **Dollar amounts**: Full numbers (1800000 not "$1.8M")

parameters:
  - name: client_name
    type: string
    required: true
    description: "The client name"
  
  - name: category_list
    type: string
    required: true
    description: "Category list from Impact results (JSON or formatted text)"
  
  - name: exhibit_a_data
    type: string
    required: true
    description: "Exhibit A category/spend data from Project Scope step"
  
  - name: category_folder_contents
    type: string
    required: true
    description: "Extracted content from individual category folders"
  
  - name: extraction_date
    type: string
    required: true
    description: "Today's date for evidence tracking"

examples:
  - note: "Healthcare with multiple implemented categories"
    input: |
      Category list from Impact: EMR (finalized, $358K), Medical Supplies (in progress, $175K)...
    output: |
      {
        "categories": [
          {
            "category_label": "EMR",
            "status": "implemented",
            "vendors_before": ["Athena"],
            "vendors_after": ["Athena (renegotiated)"],
            "levers": ["Contract renegotiation"],
            "baseline_spend": {"amount": 1600000, "confidence": "high"},
            "savings_annual_run_rate": {"amount": 358000, "confidence": "high"},
            "savings_percentage": 22.4
          }
        ]
      }
