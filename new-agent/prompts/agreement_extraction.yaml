# Agreement Extraction Prompt
# Step: Extract contract data from Agreement document (Exhibit A & B)
# Updated to agent-kit style format

step: agreement_extraction

prompt:
  instructions: |
    You are extracting contract data from a Treya Partners Agreement document.
    Focus ONLY on Exhibit A (Project Scope) and Exhibit B (Project Fees).
    Be precise - these are contractual values.

  user_template: |
    ## Agreement Document Content:
    {{agreement_content}}

    ## YOUR TASK:
    Extract the following from this Agreement document.

    ### FROM EXHIBIT A - PROJECT SCOPE TABLE:
    The table lists categories with baseline spend and savings estimates.
    
    Extract:
    - `initial_categories`: List of category names from the table
    - `addressable_spend`: Total baseline/addressable spend (sum or total row)
    - `savings_estimate_low`: Low end of savings range
    - `savings_estimate_high`: High end of savings range

    ### FROM EXHIBIT B - PROJECT FEES:
    Look for the fee structure section.
    
    Extract:
    - `fee_type`: "fixed" (flat fee), "contingent" (% of savings), or "hybrid" (both)
    - `fee_amount`: The fixed fee dollar amount (e.g., "$190,000 fixed fee" → 190000)
    - `fee_percentage`: Contingent percentage if applicable
    - `minimum_savings_guarantee`: If mentioned

    ### IMPORTANT:
    - ONLY extract what is explicitly stated in the Agreement
    - Dollar amounts should be numbers (190000 not "$190K")
    - If a value is not found, set it to null
    - Ignore example calculations (like "if savings are $600,000 then...")

    ## OUTPUT FORMAT:
    Return valid JSON only:
    ```json
    {
      "initial_categories": ["Category 1", "Category 2", ...],
      "addressable_spend": 6300000,
      "savings_estimate_low": 540000,
      "savings_estimate_high": 928000,
      "fee_type": "fixed",
      "fee_amount": 190000,
      "fee_percentage": null,
      "minimum_savings_guarantee": 380000,
      "start_date": "2020-12-11",
      "source_file": "Agreement/Signed Agreement/Agreement.pdf"
    }
    ```

parameters:
  - name: agreement_content
    type: string
    required: true
    description: "The extracted text content from the Agreement document"

examples:
  - input: |
      EXHIBIT A - PROJECT SCOPE
      Category | Baseline Spend | Savings Low | Savings High
      Medical Supplies | $1,800,000 | $180,000 | $270,000
      Office Supplies | $175,000 | $17,500 | $26,250
      Total | $6,300,000 | $540,000 | $928,000
      
      EXHIBIT B - PROJECT FEES
      Project Fees: $190,000 fixed fee
      Minimum Savings Guarantee: 2X Project Fixed Fee ($380,000)
    output: |
      {
        "initial_categories": ["Medical Supplies", "Office Supplies"],
        "addressable_spend": 6300000,
        "savings_estimate_low": 540000,
        "savings_estimate_high": 928000,
        "fee_type": "fixed",
        "fee_amount": 190000,
        "fee_percentage": null,
        "minimum_savings_guarantee": 380000
      }
